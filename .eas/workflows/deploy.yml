name: Build iOS
on:
  push:
    branches: ['main']
    paths:
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'App.tsx'
      - 'index.ts'
      - 'src/**'
      - 'assets/**'
jobs:
  build:
    type: build
    params:
      platform: ios
      profile: production
